name: Publish to pub.dev

# Runs on version tag pushes and waits for the CI workflow for the same commit
# to complete successfully before publishing.
#
# NOTE: pub.dev trusted publishing relies on GitHub OIDC context from the
# tag-triggered run. Using `workflow_run` can lose the tag context and cause
# `dart pub publish` to fall back to interactive OAuth prompts.
#
# ── First-time setup (do once per package on pub.dev) ─────────────────────
#
# 1. Publish the package manually once so the package exists on pub.dev:
#
#      dart run tool/publish.dart     # from repo root
#
# 2. For each package, go to:
#      https://pub.dev/packages/<package>/admin
#    and add an "Automated publishing" entry:
#      • Repository:  dizitart/papyrus
#      • Workflow:    publish.yml
#      • Tag pattern: v{{version}}    (the default)
#
# 3. After that, every new v* tag triggers CI and this publish workflow waits
#    for CI success, then publishes via OIDC with no stored credentials.
#
# ── Releasing ─────────────────────────────────────────────────────────────
#
#   1. Bump `version:` in all 7 package pubspec.yaml files.
#   2. Add entries to all 7 CHANGELOG.md files.
#   3. Commit: git commit -am "chore: release v<semver>"
#   4. Tag:    git tag v<semver>
#   5. Push:   git push origin main v<semver>
#
# The workflow below will run, publish all packages in dependency order, and
# wait 60 s between packages for pub.dev index propagation.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  actions: read
  contents: write # Required to update workflow_run status for publish.yml
  id-token: write # Required for pub.dev OIDC automated publishing

jobs:
  wait-for-ci:
    name: Wait for CI on this tag
    runs-on: ubuntu-latest
    steps:
      - name: Wait until CI run for this SHA finishes
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            core.info(`Waiting for CI workflow on sha ${sha}...`);

            for (let i = 0; i < 60; i++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                event: 'push',
                head_sha: sha,
                per_page: 20,
              });

              const run = data.workflow_runs.find(
                (r) => r.name === 'CI' && r.head_sha === sha,
              );

              if (!run) {
                core.info('CI run not visible yet; retrying in 15s...');
                await sleep(15000);
                continue;
              }

              core.info(`CI status=${run.status}, conclusion=${run.conclusion}`);

              if (run.status !== 'completed') {
                await sleep(15000);
                continue;
              }

              if (run.conclusion !== 'success') {
                core.setFailed(`CI concluded with '${run.conclusion}'. Publish aborted.`);
                return;
              }

              core.info('CI passed; continuing to publish.');
              return;
            }

            core.setFailed('Timed out waiting for CI completion.');

  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    needs: wait-for-ci

    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      # Optional fallback for environments where trusted publishing is not yet
      # fully configured on every package admin page.
      - name: Load pub credentials secret
        run: echo "PUB_CREDENTIALS_PRESENT=${{ secrets.PUB_CREDENTIALS != '' }}" >> "$GITHUB_ENV"

      - name: Configure pub credentials fallback
        if: ${{ env.PUB_CREDENTIALS_PRESENT == 'true' }}
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p "$HOME/.pub-cache"
          cat > "$HOME/.pub-cache/credentials.json" <<'EOF'
          $PUB_CREDENTIALS
          EOF

      # Validate that every package passes `pub publish --dry-run` before
      # touching pub.dev.
      - name: Dry-run validation
        run: dart run tool/publish.dart --dry-run

      # Publish all packages in dependency order.
      # tool/publish.dart replaces path: deps with version constraints,
      # calls `flutter/dart pub publish --force`, then restores pubspec.yaml.
      - name: Publish all packages
        run: dart run tool/publish.dart
