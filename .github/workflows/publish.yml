name: Publish to pub.dev

# Runs after the CI workflow completes successfully on a version tag push.
# This guarantees all checks (analyze, test, acceptance) are green before
# any package is published to pub.dev.
#
# ── Dependency chain ──────────────────────────────────────────────────────
#
#   git push origin main v0.1.x
#       │
#       ├─► CI workflow runs (analyze + test + acceptance) on the tag commit
#       │
#       └─► (only if CI passes) this workflow fires via workflow_run
#
# ── First-time setup (do once per package on pub.dev) ─────────────────────
#
# 1. Publish the package manually once so the package exists on pub.dev:
#
#      dart run tool/publish.dart     # from repo root
#
# 2. For each package, go to:
#      https://pub.dev/packages/<package>/admin
#    and add an "Automated publishing" entry:
#      • Repository:  dizitart/papyrus
#      • Workflow:    publish.yml
#      • Tag pattern: v{{version}}    (the default)
#
# 3. After that, every new v* tag triggers CI → Publish in sequence with no
#    stored credentials required (OIDC).
#
# ── Releasing ─────────────────────────────────────────────────────────────
#
#   1. Bump `version:` in all 7 package pubspec.yaml files.
#   2. Add entries to all 7 CHANGELOG.md files.
#   3. Commit: git commit -am "chore: release v<semver>"
#   4. Tag:    git tag v<semver>
#   5. Push:   git push origin main v<semver>
#
# The workflow below will run, publish all packages in dependency order, and
# wait 60 s between packages for pub.dev index propagation.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Matches the head branch / tag name set by the CI trigger.
    # For tag pushes the head_branch is the tag name (e.g. "v0.1.1").
    branches:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  id-token: write # Required for pub.dev OIDC automated publishing

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    # Only proceed when CI passed; skip silently on failure/cancellation.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact commit that CI validated, not whatever HEAD
          # happens to be on main at the time this workflow starts.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      # Validate that every package passes `pub publish --dry-run` before
      # touching pub.dev.
      - name: Dry-run validation
        run: dart run tool/publish.dart --dry-run

      # Publish all packages in dependency order.
      # tool/publish.dart replaces path: deps with version constraints,
      # calls `flutter/dart pub publish --force`, then restores pubspec.yaml.
      - name: Publish all packages
        run: dart run tool/publish.dart
