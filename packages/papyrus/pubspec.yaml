name: papyrus
description: Policy-driven federated native system WebView for Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  papyrus_platform_interface:
    path: ../papyrus_platform_interface
  papyrus_android:
    path: ../papyrus_android
  papyrus_ios:
    path: ../papyrus_ios
  papyrus_macos:
    path: ../papyrus_macos
  papyrus_windows:
    path: ../papyrus_windows
  papyrus_linux:
    path: ../papyrus_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: papyrus_android
      ios:
        default_package: papyrus_ios
      macos:
        default_package: papyrus_macos
      windows:
        default_package: papyrus_windows
      linux:
        default_package: papyrus_linux
