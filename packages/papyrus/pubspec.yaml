name: papyrus
description: Secure policy-driven federated native WebView for Flutter with navigation, resource, and permission controls.
version: 0.1.1
homepage: https://github.com/dizitart/papyrus
repository: https://github.com/dizitart/papyrus/tree/main/packages/papyrus
issue_tracker: https://github.com/dizitart/papyrus/issues

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  papyrus_platform_interface:
    path: ../papyrus_platform_interface
  papyrus_android:
    path: ../papyrus_android
  papyrus_ios:
    path: ../papyrus_ios
  papyrus_macos:
    path: ../papyrus_macos
  papyrus_windows:
    path: ../papyrus_windows
  papyrus_linux:
    path: ../papyrus_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: papyrus_android
      ios:
        default_package: papyrus_ios
      macos:
        default_package: papyrus_macos
      windows:
        default_package: papyrus_windows
      linux:
        default_package: papyrus_linux
