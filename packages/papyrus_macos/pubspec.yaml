name: papyrus_macos
description: macOS WKWebView implementation for Papyrus.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  papyrus_platform_interface:
    path: ../papyrus_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: papyrus
    platforms:
      macos:
        pluginClass: PapyrusMacosPlugin
        dartPluginClass: PapyrusMacos

